<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>APDO DOOM · WITRN C5</title><link rel="stylesheet" href="/style.css">
<main><header><div><p class="eyebrow">DOOM ON USB METERS</p><h1>WITRN C5 <span>PC CONTROLLER</span></h1></div><div id="connection" role="status">C5を待っています</div></header>
<section class="device" aria-label="C5のゲーム画面"><img class="shell" src="/WITRN_C5.png" alt="赤いWITRN C5"><div class="aperture"><img id="screen" alt="C5本体から取得した画面" hidden><div id="placeholder">FREEDOOM<br><small>本体の画面を待っています</small></div></div></section>
<section class="toolbar"><button id="enable" class="primary" disabled>キーボード操作を有効にする</button><button id="release">すべて離す</button><label><input id="preview" type="checkbox" checked>画面プレビュー</label><button id="enlarge" disabled>拡大</button><a id="save" href="/api/frame.jpg" download="C5-preview.jpg" hidden>画像を保存</a></section>
<section class="toolbar display-settings"><label><input id="flip" type="checkbox" disabled>本体画面を180°反転</label><label>明るさ <input id="brightness" type="range" min="10" max="100" step="5" value="30" disabled> <output id="brightness-value">30%</output></label><span id="settings-state"></span></section><div class="metrics"><span id="performance">— fps</span><span id="screen-info">本体単独でゲームが動作します</span></div><p id="error" role="alert"></p>
<section class="controls" aria-label="ゲーム操作"><div class="pad"><button data-key="2">↑<small>前進 W</small></button><div><button data-key="4">←<small>旋回 A</small></button><button data-key="128">↓<small>後退 S</small></button><button data-key="8">→<small>旋回 D</small></button></div></div><div class="actions"><button data-key="1">FIRE<small>Space / Ctrl</small></button><button data-key="16">USE<small>E · ドア</small></button><button data-key="32">MENU<small>Esc</small></button><button data-key="64">OK<small>Enter</small></button></div></section>
<footer>矢印キーでも操作できます。画面から離れるとPC入力を解除します。<br>プレビューは320×172の圧縮画像です。筐体の丸い四隅は実機と同じように表示に重なります。</footer>
<dialog id="large"><button id="close">閉じる</button><img id="large-screen" alt="拡大プレビュー"></dialog></main><script src="/controller.js"></script></html>
